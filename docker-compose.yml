services:
  postgres:
    image: postgres:16-alpine
    container_name: lpugpt-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: lpugpt
      POSTGRES_PASSWORD: lpugpt
      POSTGRES_DB: lpugpt
    ports:
      - "5432:5432"
    volumes:
      - lpugpt_pg_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/99-init.sql:ro
    command:
      - postgres
      - -c
      - max_connections=300
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=2GB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - random_page_cost=1.1
      - -c
      - wal_buffers=16MB
      - -c
      - checkpoint_completion_target=0.9
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lpugpt -d lpugpt"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  lpugpt_pg_data:
